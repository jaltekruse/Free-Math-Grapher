<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Graphing Calculator with Nerdamer</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- jQuery (needed for MathQuill) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- MathQuill -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.js"></script>

    <!-- JSXGraph -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>

    <!-- Nerdamer (UMD build with LaTeX support) -->
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/all.min.js"></script>

    <!-- React / ReactDOM / Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    
    <!-- idb-keyval -->
    <script type="module">
      import { get, set } from 'https://cdn.jsdelivr.net/npm/idb-keyval@6/+esm';
      window.idbGet = get;
      window.idbSet = set;
    </script>

    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
      }
      #jxgboard {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;
      const idbGet = window.idbGet;
      const idbSet = window.idbSet;

      function debounce(fn, delay) {
        let timer;
        return (...args) => {
          clearTimeout(timer);
          timer = setTimeout(() => fn(...args), delay);
        };
      }

      const saveExpressionsDebounced = debounce((expressions) => {
        idbSet("expressions", expressions);
      }, 500);

      // --- Sharing helpers ---
      function encodeState(expressions) {
        return btoa(encodeURIComponent(JSON.stringify(expressions)));
      }
      function decodeState(hash) {
        try {
          return JSON.parse(decodeURIComponent(atob(hash)));
        } catch(e) {
          console.log(e);
          return null;
        }
      }

      function MathInput({ latex, onChange }) {
        const containerRef = useRef(null);
        const mathFieldRef = useRef(null);

        useEffect(() => {
          if (!containerRef.current || !window.MathQuill) return;
          const MQ = window.MathQuill.getInterface(2);
          mathFieldRef.current = MQ.MathField(containerRef.current, {
            spaceBehavesLikeTab: true,
            handlers: {
              edit: () => {
                onChange(mathFieldRef.current.latex());
              },
            },
          });
          mathFieldRef.current.latex(latex || "");
        }, []);

        useEffect(() => {
          if (mathFieldRef.current && latex !== mathFieldRef.current.latex()) {
            mathFieldRef.current.latex(latex || "");
          }
        }, [latex]);

        return (
          <span
            ref={containerRef}
            className="block bg-white p-2 rounded border min-h-[40px] flex-1"
          ></span>
        );
      }

      function GraphingCalculator() {
        const boardRef = useRef(null);
        const [expressions, setExpressions] = useState([{ latex: "", color: "blue" }]);
        const jsxBoard = useRef(null);
        const curvesRef = useRef([]);
        const colors = ["blue", "red", "green", "purple", "orange", "black"];

        // Load from URL hash first, else IndexedDB
        useEffect(() => {
          const hash = window.location.hash.slice(1);
          if (hash) {
            const decoded = decodeState(hash);
            if (decoded && Array.isArray(decoded)) {
              setExpressions(decoded);
              return;
            }
          }
          idbGet("expressions").then((saved) => {
            if (saved && Array.isArray(saved) && saved.length > 0) {
              setExpressions(saved);
            }
          });
        }, []);

        // Save (debounced)
        useEffect(() => {
          saveExpressionsDebounced(expressions);
        }, [expressions]);

        // Init JSXGraph
        useEffect(() => {
          if (!boardRef.current) return;
          if (!jsxBoard.current) {
            jsxBoard.current = JXG.JSXGraph.initBoard("jxgboard", {
              boundingbox: [-10, 10, 10, -10],
              axis: true,
              grid: true,
              keepaspectratio: true,
              showCopyright: false,
              pan: {
                enabled: true,
                needShift: false
              },
              zoom: {
                factorX: 1.25,
                factorY: 1.25,
                wheel: true,
                pinsh: true,
                needshift: false,
                eps: 0.1
              }
            });
          }
        }, []);

        // Draw curves
        useEffect(() => {
          if (!jsxBoard.current) return;
          const board = jsxBoard.current;

          curvesRef.current.forEach((c) => board.removeObject(c));
          curvesRef.current = [];

          expressions.forEach(({ latex, color }) => {
            if (!latex.trim()) return;
            try {
              const normalized = latex.replace(/−/g, "-");
              let curve;

              if (normalized.includes("=")) {
                const [lhs, rhs] = normalized.split("=");
                const fLatex = `(${lhs}) - (${rhs})`;
                const parsed = nerdamer.convertFromLaTeX(fLatex);
                const f = parsed.buildFunction(["x","y"]);
                let failedOnce = false;
                const fWrapped = (x,y) => {
                    if (failedOnce) return;
                    try {
                        return f(x,y)
                    } catch (e) {
                        failedOnce = true;
                        console.log(e);
                    }
                }
                curve = board.create("implicitcurve", [(x,y) => fWrapped(x,y)], { strokeColor: color });
              } else {
                const parsed = nerdamer.convertFromLaTeX(normalized);
                const f = parsed.buildFunction(["x"]);
                let failedOnce = false;
                const fWrapped = (x) => {
                    if (failedOnce) return;
                    try {
                        return f(x)
                    } catch (e) {
                        failedOnce = true;
                        console.log(e);
                    }
                }
                curve = board.create("functiongraph", [(x) => fWrapped(x)], { strokeColor: color });
              }

              curvesRef.current.push(curve);
            } catch(e) {
              console.warn("Invalid expression:", latex, e);
            }
          });

          board.update();
        }, [expressions]);

        const updateExpression = (index, newLatex) => {
          setExpressions(exprs => exprs.map((ex, i) => 
            i === index ? { ...ex, latex: newLatex } : ex
          ));
        };

        const updateColor = (index, newColor) => {
          setExpressions(exprs => exprs.map((ex, i) => 
            i === index ? { ...ex, color: newColor } : ex
          ));
        };

        const addInput = () => {
          const nextColor = colors[expressions.length % colors.length];
          setExpressions([...expressions, { latex: "", color: nextColor }]);
        };

        const shareLink = () => {
          const encoded = encodeState(expressions);
          const url = `${window.location.origin}${window.location.pathname}#${encoded}`;
          navigator.clipboard.writeText(url).then(() => {
            alert("Shareable link copied to clipboard!");
          });
        };

        return (
          <div className="flex h-full">
            <div className="w-1/3 p-4 space-y-2 overflow-y-auto bg-gray-100">
              {expressions.map((expr, i) => (
                <div key={i} className="flex items-center space-x-2">
                  <select
                    value={expr.color}
                    onChange={(e) => updateColor(i, e.target.value)}
                    className="border rounded p-1"
                  >
                    {colors.map((c) => (
                      <option key={c} value={c} style={{ color: c }}>
                        {c}
                      </option>
                    ))}
                  </select>
                  <MathInput
                    latex={expr.latex}
                    onChange={(latex) => updateExpression(i, latex)}
                  />
                </div>
              ))}
              <div className="flex space-x-2">
                <button
                  onClick={addInput}
                  className="px-3 py-2 bg-blue-500 text-white rounded"
                >
                  + Add Expression
                </button>
                <button
                  onClick={shareLink}
                  className="px-3 py-2 bg-green-500 text-white rounded"
                >
                  Share
                </button>
              </div>
            </div>
            <div className="w-2/3 h-full" id="jxgboard" ref={boardRef}></div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        <GraphingCalculator />
      );
    </script>
  </body>
</html>
