<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Graphing Calculator with Nerdamer</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- jQuery (needed for MathQuill) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- MathQuill -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.js"></script>

    <!-- JSXGraph -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>

    <!-- Nerdamer (UMD build with LaTeX support) -->
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/all.min.js"></script>

    <!-- React / ReactDOM / Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  </head>
  <body class="h-screen">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // React wrapper for MathQuill input
      function MathInput({ latex, onChange }) {
        const containerRef = useRef(null);
        const mathFieldRef = useRef(null);

        useEffect(() => {
          if (!containerRef.current || !window.MathQuill) return;
          const MQ = window.MathQuill.getInterface(2);
          mathFieldRef.current = MQ.MathField(containerRef.current, {
            spaceBehavesLikeTab: true,
            handlers: {
              edit: () => {
                onChange(mathFieldRef.current.latex());
              },
            },
          });
          mathFieldRef.current.latex(latex || "");
        }, []);

        return (
          <span
            ref={containerRef}
            className="block bg-white p-2 rounded border min-h-[40px]"
          ></span>
        );
      }

      function GraphingCalculator() {
        const boardRef = useRef(null);
        const [expressions, setExpressions] = useState([""]);
        const jsxBoard = useRef(null);

useEffect(() => {
  if (!boardRef.current) return;
  if (!jsxBoard.current) {
    jsxBoard.current = JXG.JSXGraph.initBoard("jxgboard", {
      boundingbox: [-10, 10, 10, -10],
      axis: true,
      grid: true,
      keepaspectratio: true,
      showCopyright: false
    });
  }
}, []);

        // Redraw curves whenever expressions change
        useEffect(() => {
          if (!jsxBoard.current) return;
          const board = jsxBoard.current;
          board.removeObject(board.objectsList);

          expressions.forEach((expr) => {
            if (!expr.trim()) return;

            try {
              if (expr.includes("=")) {
                // Implicit: lhs = rhs
                const [lhs, rhs] = expr.split("=");
                const fLatex = `(${lhs}) - (${rhs})`;
                const parsed = nerdamer.convertFromLaTeX(fLatex);
                const f = parsed.buildFunction(["x", "y"]);
                board.create("implicitcurve", [(x, y) => f(x, y)]);
              } else {
                // Explicit: y = f(x)
                const parsed = nerdamer.convertFromLaTeX(expr);
                const f = parsed.buildFunction(["x"]);
                board.create("functiongraph", [(x) => f(x)]);
              }
            } catch (e) {
              console.warn("Invalid expression:", expr, e);
            }
          });

          board.update();
        }, [expressions]);

        const updateExpression = (index, latex) => {
          const newExpressions = [...expressions];
          newExpressions[index] = latex;
          setExpressions(newExpressions);
        };

        const addInput = () => setExpressions([...expressions, ""]);

        return (
          <div className="flex h-full">
            {/* Left input column */}
            <div className="w-1/3 p-4 space-y-2 overflow-y-auto bg-gray-100">
              {expressions.map((expr, i) => (
                <MathInput
                  key={i}
                  latex={expr}
                  onChange={(latex) => updateExpression(i, latex)}
                />
              ))}
              <button
                onClick={addInput}
                className="px-3 py-2 bg-blue-500 text-white rounded"
              >
                + Add Expression
              </button>
            </div>

            {/* Right side graph */}
            <div className="w-2/3 h-full" id="jxgboard" ref={boardRef}></div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        <GraphingCalculator />
      );
    </script>
  </body>
</html>
