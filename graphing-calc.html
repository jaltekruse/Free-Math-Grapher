<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Graphing Calculator with math.js</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- jQuery (for MathQuill) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- MathQuill -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.js"></script>

    <!-- JSXGraph -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>

    <!-- math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/13.2.0/math.js"></script>

    <!-- React / ReactDOM / Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  </head>
  <body class="h-screen">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // React wrapper for MathQuill
      function MathInput({ latex, onChange }) {
        const containerRef = useRef(null);
        const mathFieldRef = useRef(null);

        useEffect(() => {
          if (!containerRef.current || !window.MathQuill) return;
          const MQ = window.MathQuill.getInterface(2);
          mathFieldRef.current = MQ.MathField(containerRef.current, {
            spaceBehavesLikeTab: true,
            handlers: {
              edit: () => {
                onChange(mathFieldRef.current.latex());
              },
            },
          });
          mathFieldRef.current.latex(latex || "");
        }, []);

        return (
          <span
            ref={containerRef}
            className="block bg-white p-2 rounded border min-h-[40px]"
          ></span>
        );
      }

      function GraphingCalculator() {
        const boardRef = useRef(null);
        const [expressions, setExpressions] = useState([""]);
        const jsxBoard = useRef(null);

        // Setup JSXGraph board
        useEffect(() => {
          if (!boardRef.current) return;
          if (!jsxBoard.current) {
            jsxBoard.current = JXG.JSXGraph.initBoard("jxgboard", {
              boundingbox: [-10, 10, 10, -10],
              axis: true,
            });
          }
        }, []);

        // Redraw curves whenever expressions change
        useEffect(() => {
          if (!jsxBoard.current) return;
          const board = jsxBoard.current;
          board.removeObject(board.objectsList);

          expressions.forEach((expr) => {
            if (!expr.trim()) return;

            try {
              const clean = latexToMath(expr);

              if (clean.includes("=")) {
                // implicit curve: left = right
                const [lhs, rhs] = clean.split("=");
                const f = math.parse(`(${lhs}) - (${rhs})`).compile();
                board.create("implicitcurve", [
                  (x, y) => f.evaluate({ x, y }),
                ]);
              } else {
                // explicit function: y = f(x)
                const f = math.parse(clean).compile();
                board.create("functiongraph", [
                  (x) => f.evaluate({ x }),
                ]);
              }
            } catch (e) {
              console.warn("Invalid expression:", expr, e);
            }
          });

          board.update();
        }, [expressions]);

        const latexToMath = (latex) => {
          return latex
            .replace(/\\cdot/g, "*")
            .replace(/\\frac{([^}]*)}{([^}]*)}/g, "($1)/($2)")
            .replace(/\\sqrt{([^}]*)}/g, "sqrt($1)")
            .replace(/\\pi/g, "pi")
            .replace(/\\sin/g, "sin")
            .replace(/\\cos/g, "cos")
            .replace(/\\tan/g, "tan")
            .replace(/\\ln/g, "log")
            .replace(/\\log/g, "log");
        };

        const updateExpression = (index, latex) => {
          const newExpressions = [...expressions];
          newExpressions[index] = latex;
          setExpressions(newExpressions);
        };

        const addInput = () => setExpressions([...expressions, ""]);

        return (
          <div className="flex h-full">
            {/* Left input column */}
            <div className="w-1/3 p-4 space-y-2 overflow-y-auto bg-gray-100">
              {expressions.map((expr, i) => (
                <MathInput
                  key={i}
                  latex={expr}
                  onChange={(latex) => updateExpression(i, latex)}
                />
              ))}
              <button
                onClick={addInput}
                className="px-3 py-2 bg-blue-500 text-white rounded"
              >
                + Add Expression
              </button>
            </div>

            {/* Right side graph */}
            <div className="w-2/3 h-full" id="jxgboard" ref={boardRef}></div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        <GraphingCalculator />
      );
    </script>
  </body>
</html>
