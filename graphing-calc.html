<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Graphing Calculator with Nerdamer & Colors</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" />
  <script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/all.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <style>
    html, body, #root { height: 100%; margin: 0; }
    #jxgboard { width: 100%; height: 100%; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function MathInput({ latex, onChange }) {
  const containerRef = useRef(null);
  const mathFieldRef = useRef(null);
  useEffect(() => {
    if (!containerRef.current || !window.MathQuill) return;
    const MQ = window.MathQuill.getInterface(2);
    mathFieldRef.current = MQ.MathField(containerRef.current, {
      spaceBehavesLikeTab: true,
      handlers: { edit: () => { onChange(mathFieldRef.current.latex()); } },
    });
    mathFieldRef.current.latex(latex || "");
  }, []);
  return <span ref={containerRef} className="block bg-white p-2 rounded border min-h-[40px]"></span>;
}

function GraphingCalculator() {
  const boardRef = useRef(null);
  const [expressions, setExpressions] = useState([""]);
  const jsxBoard = useRef(null);
  const curvesRef = useRef([]);

  // Minimal color addition
  const colors = ["#e6194B","#3cb44b","#ffe119","#4363d8","#f58231","#911eb4","#46f0f0","#f032e6"];

  useEffect(() => {
    if (!boardRef.current) return;
    if (!jsxBoard.current) {
      jsxBoard.current = JXG.JSXGraph.initBoard("jxgboard", {
        boundingbox: [-10, 10, 10, -10],
        axis: true, grid: true, keepaspectratio: true, showCopyright: false
      });
    }
  }, []);

  useEffect(() => {
    if (!jsxBoard.current) return;
    const board = jsxBoard.current;
    curvesRef.current.forEach(c => board.removeObject(c));
    curvesRef.current = [];
    expressions.forEach((expr,index) => {
      if (!expr.trim()) return;
      try {
        const normalized = expr.replace(/−/g,"-");
        const color = colors[index % colors.length];
        let curve;
        if (normalized.includes("=")) {
          const [lhs,rhs] = normalized.split("=");
          const fLatex = `(${lhs}) - (${rhs})`;
          const parsed = nerdamer.convertFromLaTeX(fLatex);
          const f = parsed.buildFunction(["x","y"]);
          curve = board.create("implicitcurve",[(x,y)=>f(x,y)], { strokeColor: color });
        } else {
          const parsed = nerdamer.convertFromLaTeX(normalized);
          const f = parsed.buildFunction(["x"]);
          curve = board.create("functiongraph",[(x)=>f(x)], { strokeColor: color });
        }
        curvesRef.current.push(curve);
      } catch(e) {
        console.warn("Invalid expression:",expr,e);
      }
    });
    board.update();
  }, [expressions]);

  const updateExpression = (i, latex) => {
    const arr = [...expressions];
    arr[i] = latex;
    setExpressions(arr);
  };
  const addInput = () => setExpressions([...expressions,""]);

  return (
    <div className="flex h-full">
      <div className="w-1/3 p-4 space-y-2 overflow-y-auto bg-gray-100">
        {expressions.map((expr,i)=>(
          <MathInput key={i} latex={expr} onChange={latex=>updateExpression(i,latex)} />
        ))}
        <button onClick={addInput} className="px-3 py-2 bg-blue-500 text-white rounded">+ Add Expression</button>
      </div>
      <div className="w-2/3 h-full" id="jxgboard" ref={boardRef}></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GraphingCalculator />);
</script>
</body>
</html>
